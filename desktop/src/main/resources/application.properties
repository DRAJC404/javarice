




db.url=jdbc:postgresql://localhost:5432/bai_pos
db.user=bai_app_user
db.password=bai_password
db.maximumPoolSize=10
db.minimumIdle=2
db.connectionTimeout=5000
db.idleTimeout=600000
db.maxLifetime=1800000


bai.dev.mode=false
bai.kiosk.mode=false
bai.idle.timeout.minutes=5


app.name=bAI Inventory Assistant
app.currency.symbol=₱
app.low_stock.default_threshold=10


ai.llm.enabled=true
ai.llm.provider=gemini
ai.llm.api.key=${GEMINI_API_KEY:-demo_key}
ai.llm.model=gemini-1.5-flash
ai.cache.ttl.minutes=60
